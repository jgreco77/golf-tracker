name: Process Scorecard

on:
  repository_dispatch:
    types: [process-scorecard]
  workflow_dispatch:

jobs:
  parse-scorecard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install Pillow requests google-genai

      - name: Run Scorecard Parser
        env:
          IMAGE_PATH: ${{ github.event.client_payload.image_path }}
          COURSE_OVERRIDE: ${{ github.event.client_payload.course_override }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/parse_card.py

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "GolfTracker Bot"
          git config --global user.email "bot@golftracker.local"
          git add data/player_stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Parse scorecard data [skip ci]"
            git push
          fi
          
